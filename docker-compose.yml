version: "3.9"

services:
  api:
    build: .
    container_name: inference-api
    env_file:
      - .env.example
    environment:
      ENABLE_DB: "false"
      ENABLE_ASYNC: "false"
      ENABLE_S3: "false"
      WORKERS: "1"
      DEVICE: "cpu"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./models:/models:ro
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: inference-redis
    profiles: ["async"]
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: inference-postgres
    profiles: ["db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inference
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  worker:
    build: .
    container_name: inference-worker
    env_file:
      - .env.example
    environment:
      ENABLE_ASYNC: "true"
      REDIS_URL: "redis://redis:6379/0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=INFO
    depends_on:
      - redis
    profiles: ["async"]

  minio:
    image: minio/minio:RELEASE.2024-07-26T20-48-21Z
    container_name: inference-minio
    profiles: ["storage"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
